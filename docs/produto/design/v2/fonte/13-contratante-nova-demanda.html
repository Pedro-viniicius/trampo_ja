<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<title>Contratante · Nova demanda</title>
<script src="fcf00f3f-1e15-4cb7-89b1-5be8422f0eeb"></script>
</head>
<body>
<x-dc>
<helmet>
<style>



















</style>
<style>
body{margin:0}
a{color:#0F6AD8}a:hover{color:#0B54AD}
.tj-press{transition:transform .12s ease, background-color .16s ease, box-shadow .16s ease;cursor:pointer}
.tj-press:active{transform:scale(.95)}
.tj-field{transition:border-color .16s ease, box-shadow .16s ease}
.tj-field:focus{border-color:#1A7FF6 !important;box-shadow:0 0 0 4px rgba(26,127,246,.18)}
@keyframes tj-bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7FA; font-family: Figtree, system-ui, -apple-system, sans-serif; color: #161A2B; position: relative; overflow: hidden;">
  <main style="padding: 56px 24px 140px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="C-Inicio.dc.html" aria-label="Voltar" class="tj-press" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; color: #161A2B; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(22,26,43,.08);"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 26px; line-height: 32px; letter-spacing: -0.02em;">Nova demanda</h1>
    </div>

    <div style="background: #FFFFFF; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 2px rgba(22,26,43,.06);">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="cargo" style="font-size: 14px; font-weight: 600;">Função/Cargo</label>
        <sc-raw-select id="cargo" class="tj-field" style="height: 52px; border: 1.5px solid #E1E4EC; border-radius: 16px; padding: 0 14px; font: 500 16px Figtree, system-ui, sans-serif; color: #161A2B; background: #FFFFFF; outline: none;"><option>Chapeiro</option><option>Garçom</option><option>Auxiliar de cozinha</option><option>Atendente de balcão</option></sc-raw-select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="exp" style="font-size: 14px; font-weight: 600;">Experiência desejada</label>
        <sc-raw-select id="exp" class="tj-field" style="height: 52px; border: 1.5px solid #E1E4EC; border-radius: 16px; padding: 0 14px; font: 500 16px Figtree, system-ui, sans-serif; color: #161A2B; background: #FFFFFF; outline: none;"><option>Sem experiência</option><option selected="">2 anos de experiência</option><option>5+ anos</option></sc-raw-select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="data" style="font-size: 14px; font-weight: 600;">Data e horário</label>
        <div style="position: relative; display: flex;">
          <input id="data" class="tj-field" value="Sexta-feira, 19:00 às 00:00" style="flex: 1; height: 52px; box-sizing: border-box; border: 1.5px solid #E1E4EC; border-radius: 16px; padding: 0 48px 0 14px; font: 500 16px Figtree, system-ui, sans-serif; color: #161A2B; outline: none;">
          <svg style="position: absolute; right: 14px; top: 15px;" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0F6AD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="valor" style="font-size: 14px; font-weight: 600;">Remuneração</label>
        <div style="position: relative; display: flex; align-items: center;">
          <span style="position: absolute; left: 14px; font-size: 16px; font-weight: 600; color: #555B73;">R$</span>
          <input id="valor" class="tj-field" inputmode="numeric" value="{{ price }}" sc-camel-on-change="{{ onPrice }}" style="flex: 1; height: 52px; box-sizing: border-box; border: 1.5px solid #E1E4EC; border-radius: 16px; padding: 0 110px 0 44px; font: 600 16px Figtree, system-ui, sans-serif; color: #161A2B; outline: none;">
          <span style="position: absolute; right: 14px; font-size: 14px; color: #555B73; font-weight: 600;">por pessoa</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span id="qtd" style="font-size: 14px; font-weight: 600;">Quantidade de profissionais</span>
        <div role="group" aria-labelledby="qtd" style="display: flex; align-items: center; justify-content: space-between; background: #F6F7FA; border-radius: 999px; padding: 6px;">
          <button aria-label="Diminuir" sc-camel-on-click="{{ dec }}" class="tj-press" style="{{ decStyle }}"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
          <b aria-live="polite" style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px;">{{ qty }}</b>
          <button aria-label="Aumentar" sc-camel-on-click="{{ inc }}" class="tj-press" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #0F6AD8; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
        </div>
        <span style="font-size: 13px; color: #555B73;">Quantas pessoas você quer contratar para esse turno?</span>
      </div>
    </div>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; padding: 16px 24px 32px; box-shadow: 0 -8px 24px -12px rgba(22,26,43,.18); border-radius: 28px 28px 0 0; display: flex; align-items: center; gap: 16px;">
    <span style="display: flex; flex-direction: column;"><span style="font-size: 12px; color: #555B73; font-weight: 600;">Total previsto</span><b style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 22px; line-height: 26px;">{{ total }}</b></span>
    <a href="C-Demandas.dc.html" class="tj-press" style="flex: 1; height: 56px; border-radius: 999px; background: linear-gradient(135deg, #0F6AD8 0%, #9550E0 100%); color: #FFFFFF; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 12px 24px -10px rgba(122,59,191,.6);">Publicar demanda</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { qty: 3, price: '150' }; }
  renderVals() {
    const q = this.state.qty;
    const p = parseInt(String(this.state.price).replace(/\D/g, ''), 10) || 0;
    const min = q <= 1;
    return {
      qty: q,
      price: this.state.price,
      total: 'R$ ' + (q * p).toLocaleString('pt-BR'),
      onPrice: (e) => this.setState({ price: e.target.value.replace(/\D/g, '') }),
      dec: () => { if (!min) this.setState({ qty: q - 1 }); },
      inc: () => this.setState({ qty: Math.min(20, q + 1) }),
      decStyle: 'width: 44px; height: 44px; border: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; ' + (min ? 'background: #EEF0F5; color: #9AA0B4; cursor: not-allowed;' : 'background: #FFFFFF; color: #161A2B; box-shadow: 0 1px 3px rgba(22,26,43,.12);')
    };
  }
}
</script>


</body></html>
