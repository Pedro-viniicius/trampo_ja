<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<title>Freela · Chat</title>
<script src="9cb23797-56ba-4c2f-8d03-1a078119bc95"></script>
</head>
<body>
<x-dc>
<helmet>
<style>



















</style>
<style>
body{margin:0}
a{color:#0F6AD8}a:hover{color:#0B54AD}
.tj-press{transition:transform .12s ease, background-color .16s ease, box-shadow .16s ease;cursor:pointer}
.tj-press:active{transform:scale(.95)}
@keyframes tj-in{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.tj-in{animation:tj-in .28s cubic-bezier(.2,.8,.2,1)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7FA; font-family: Figtree, system-ui, -apple-system, sans-serif; color: #161A2B; display: flex; flex-direction: column; overflow: hidden;">

  <header style="background: #FFFFFF; padding: 56px 16px 12px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(22,26,43,.06);">
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="F-Conversas.dc.html" aria-label="Voltar" class="tj-press" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #F6F7FA; color: #161A2B; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
      <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 15px; background: #EFE2FD; color: #632F9A; display: flex; align-items: center; justify-content: center; font: 800 16px 'Bricolage Grotesque', system-ui, sans-serif;">BE</span>
      <div style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 16px;">Bistrô Estrela</b><span style="font-size: 13px; color: #0B7A3D; font-weight: 600;">Disponível agora</span></div>
    </div>
    <a href="F-MeusTrampos.dc.html" class="tj-press" style="background: #F8F2FE; border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #161A2B;">
      <span style="width: 32px; height: 32px; border-radius: 10px; background: #FFFFFF; color: #7A3BBF; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="7" rx="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column;"><b style="font-size: 14px;">Garçonete · hoje, 18h às 23h</b><span style="font-size: 12px; color: #632F9A; font-weight: 700;">Confirmado · R$ 120</span></span>
      <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#7A3BBF" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </a>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px;">
    <span style="align-self: center; height: 28px; padding: 0 12px; border-radius: 999px; background: #EEF0F5; color: #555B73; font-size: 12px; font-weight: 700; display: flex; align-items: center;">Hoje</span>
    <div style="align-self: flex-start; max-width: 80%; background: #FFFFFF; border-radius: 20px 20px 20px 6px; padding: 10px 14px; font-size: 15px; line-height: 21px; box-shadow: 0 1px 2px rgba(22,26,43,.06); display: flex; flex-direction: column; gap: 4px;">Olá, Laura! Seu trabalho está confirmado. Pode chegar 15 minutos antes?<span style="align-self: flex-end; font-size: 11px; color: #555B73;">09:32</span></div>
    <div style="align-self: flex-end; max-width: 80%; background: linear-gradient(135deg, #0F6AD8 0%, #7A3BBF 140%); color: #FFFFFF; border-radius: 20px 20px 6px 20px; padding: 10px 14px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 4px;">Claro! Estarei aí às 17h45. Obrigada pela confirmação.<span style="align-self: flex-end; font-size: 11px; display: flex; align-items: center; gap: 4px;">09:38<svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="Lida"><path d="M18 6 7 17l-5-5M22 10l-7.5 7.5L13 16"></path></svg></span></div>
    <sc-for list="{{ sent }}" as="m" hint-placeholder-count="0">
      <div class="tj-in" style="align-self: flex-end; max-width: 80%; background: linear-gradient(135deg, #0F6AD8 0%, #7A3BBF 140%); color: #FFFFFF; border-radius: 20px 20px 6px 20px; padding: 10px 14px; font-size: 15px; line-height: 21px;">{{ m.text }}</div>
    </sc-for>
  </main>

  <div style="display: flex; gap: 8px; padding: 0 16px 12px; overflow: hidden;">
    <sc-for list="{{ quick }}" as="q" hint-placeholder-count="3">
      <button class="tj-press" sc-camel-on-click="{{ q.send }}" style="height: 40px; padding: 0 14px; flex-shrink: 0; border: 1.5px solid #DFC6FB; border-radius: 999px; background: #FFFFFF; color: #632F9A; font: 600 14px Figtree, system-ui, sans-serif; white-space: nowrap;">{{ q.text }}</button>
    </sc-for>
  </div>

  <footer style="background: #FFFFFF; padding: 12px 16px 32px; display: flex; align-items: center; gap: 8px; box-shadow: 0 -1px 2px rgba(22,26,43,.06);">
    <button aria-label="Anexar" class="tj-press" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; background: #F6F7FA; color: #161A2B; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
    <label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Mensagem</label>
    <input id="msg" value="{{ draft }}" sc-camel-on-change="{{ onType }}" placeholder="Digite uma mensagem…" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; border: 0; border-radius: 999px; background: #F6F7FA; padding: 0 16px; font: 400 16px Figtree, system-ui, sans-serif; color: #161A2B; outline: none;">
    <button aria-label="Enviar" sc-camel-on-click="{{ send }}" class="tj-press" style="width: 48px; height: 48px; flex-shrink: 0; border: 0; border-radius: 50%; background: linear-gradient(135deg, #0F6AD8 0%, #9550E0 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 16px -6px rgba(122,59,191,.6);"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg></button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { draft: '', sent: [] }; }
  push(t) { this.setState({ draft: '', sent: this.state.sent.concat([{ text: t }]).slice(-3) }); }
  renderVals() {
    return {
      draft: this.state.draft,
      sent: this.state.sent,
      quick: ['Estou a caminho', 'Cheguei!', 'Vou atrasar 10 min'].map((t) => ({ text: t, send: () => this.push(t) })),
      onType: (e) => this.setState({ draft: e.target.value }),
      send: () => { const t = (this.state.draft || '').trim(); if (t) this.push(t); }
    };
  }
}
</script>


</body></html>
